name: Nifty 50 Fundamental Analyser

on:
  # ── Manual trigger (run any time from Actions tab) ─────────────
  workflow_dispatch:

  # ── Scheduled: every Monday 07:00 IST (01:30 UTC) ──────────────
  schedule:
    - cron: "30 1 * * 1"

permissions:
  contents: write       # needed to push to gh-pages branch
  pages: write
  id-token: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance requests beautifulsoup4 lxml

      - name: Run Nifty 50 analyser
        run: python Analyser.py --out reports

      - name: Rename report to index.html for GitHub Pages
        run: |
          mkdir -p pages
          cp reports/nifty50_*.html pages/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          publish_branch: gh-pages

      - name: Upload combined HTML report (backup artifact)
        uses: actions/upload-artifact@v4
        with:
          name: nifty50-report-${{ github.run_number }}
          path: reports/nifty50_*.html
          retention-days: 90
