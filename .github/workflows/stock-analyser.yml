name: Nifty 50 Fundamental Analyser

on:
  # ── Manual trigger (run any time from Actions tab) ─────────────
  workflow_dispatch:

  # ── Scheduled: every Monday 07:00 IST (01:30 UTC) ──────────────
  schedule:
    - cron: "30 1 * * 1"

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60       # 50 stocks × ~60s each = ~50 min max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance requests beautifulsoup4 lxml

      - name: Run Nifty 50 analyser
        run: python Analyser.py --out reports

      - name: Upload combined HTML report
        uses: actions/upload-artifact@v4
        with:
          name: nifty50-report-${{ github.run_number }}
          path: reports/nifty50_*.html
          retention-days: 90    # keep 3 months of weekly reports
