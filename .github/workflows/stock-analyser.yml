name: Nifty 50 Fundamental Analyser

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance requests beautifulsoup4 lxml

      - name: Run Nifty 50 analyser
        run: python Analyser.py --out reports

      # ── Deploy to /fundamentals/ subfolder so it does NOT
      #    overwrite the other script's output at the root ──────────
      - name: Prepare pages subfolder
        run: |
          mkdir -p pages/fundamentals
          cp reports/nifty50_*.html pages/fundamentals/index.html

      - name: Deploy to GitHub Pages (fundamentals subfolder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          publish_branch: gh-pages
          keep_files: true          # ← IMPORTANT: keeps other scripts output intact

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: nifty50-report-${{ github.run_number }}
          path: reports/nifty50_*.html
          retention-days: 90
